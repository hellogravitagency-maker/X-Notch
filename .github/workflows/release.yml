name: Release

# Builds the standalone portable X-Notch.exe and Inno Setup installer (*-Setup.exe)
# and publishes them to GitHub Releases. The in-app updater (UpdateService) uses
# the *-Setup.exe asset for silent in-place auto-upgrades, while users can also
# download and run the standalone portable X-Notch.exe directly.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release (e.g. 0.8.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release X-Notch
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}".TrimStart('v', 'V')
            $tag = "v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart('v', 'V')
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version could not be determined."
          }

          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Releasing version: $version with tag: $tag"

      - name: Run Test Suite
        run: dotnet test tests/XNotch.Tests/XNotch.Tests.csproj -c Release --verbosity normal

      - name: Publish Standalone Portable Executable (X-Notch.exe)
        run: >
          dotnet publish src/XNotch/XNotch.csproj -c Release -o publish
          -p:Version=${{ env.APP_VERSION }}
          -p:AssemblyVersion=${{ env.APP_VERSION }}.0
          -p:FileVersion=${{ env.APP_VERSION }}.0
          -p:InformationalVersion=${{ env.APP_VERSION }}

      - name: Build Official Example Plugins
        shell: pwsh
        run: |
          $pluginProjects = Get-ChildItem -Path "Examples/Plugins" -Filter "*.csproj" -Recurse
          New-Item -ItemType Directory -Path "publish/plugins" -Force | Out-Null
          foreach ($proj in $pluginProjects) {
            Write-Host "Building plugin: $($proj.Name)..."
            dotnet build $proj.FullName -c Release -o "publish/plugins/$($proj.Directory.Name)"
            $manifest = Join-Path $proj.Directory.FullName "manifest.json"
            if (Test-Path $manifest) {
              Copy-Item $manifest "publish/plugins/$($proj.Directory.Name)/manifest.json" -Force
            }
          }
          Compress-Archive -Path "publish/plugins/*" -DestinationPath "publish/X-Notch-Plugins.zip" -Force

      - name: Install Inno Setup
        continue-on-error: true
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Installer (X-Notch-Setup.exe)
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "/DMyAppVersion=$env:APP_VERSION" installer\X-Notch.iss
          } else {
            Write-Warning "Inno Setup compiler not found; installer build skipped."
          }

      - name: Compute SHA256 Checksums
        shell: pwsh
        run: |
          $files = @()
          if (Test-Path "publish/X-Notch.exe") { $files += "publish/X-Notch.exe" }
          $installer = "publish/installer/X-Notch-$env:APP_VERSION-Setup.exe"
          if (Test-Path $installer) { $files += $installer }
          if (Test-Path "publish/X-Notch-Plugins.zip") { $files += "publish/X-Notch-Plugins.zip" }

          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
            $name = Split-Path -Leaf $file
            "$hash  $name"
          }
          $checksums | Out-File -FilePath "publish/SHA256SUMS.txt" -Encoding utf8
          Get-Content "publish/SHA256SUMS.txt"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "X-Notch ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          files: |
            publish/X-Notch.exe
            publish/installer/X-Notch-${{ env.APP_VERSION }}-Setup.exe
            publish/X-Notch-Plugins.zip
            publish/SHA256SUMS.txt
