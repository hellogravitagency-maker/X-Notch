name: CI

# Continuous Integration: builds solution, runs all tests, and verifies
# single-file publishing and plugin projects on every push and PR.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore X-Notch.sln

      - name: Build solution (Release)
        run: dotnet build X-Notch.sln -c Release --no-restore

      - name: Run test suite
        run: dotnet test tests/XNotch.Tests/XNotch.Tests.csproj -c Release --no-build --verbosity normal

      - name: Verify single-file publish
        run: dotnet publish src/XNotch/XNotch.csproj -c Release -o ci_publish -p:PublishSingleFile=true

      - name: Verify publish artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "ci_publish/X-Notch.exe")) {
            throw "ci_publish/X-Notch.exe was not created."
          }
          $size = (Get-Item "ci_publish/X-Notch.exe").Length
          Write-Host "X-Notch.exe built successfully ($([math]::Round($size / 1MB, 2)) MB)."
